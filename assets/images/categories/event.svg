<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <linearGradient id="eventBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="eventGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#eventBg)"/>
  <rect width="400" height="225" fill="url(#eventGlow)"/>

  <!-- Decorative Rings & Confetti -->
  <circle cx="200" cy="95" r="75" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="200" cy="95" r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="120" cy="60" r="4" fill="#FDE047" opacity="0.6"/>
  <circle cx="280" cy="70" r="3" fill="#F472B6" opacity="0.6"/>
  <circle cx="290" cy="130" r="5" fill="#38BDF8" opacity="0.5"/>
  <circle cx="105" cy="140" r="3" fill="#4ADE80" opacity="0.5"/>

  <!-- Calendar Icon -->
  <g transform="translate(165, 48)">
    <!-- Calendar Body -->
    <rect x="5" y="8" width="60" height="64" rx="10" fill="#FFFFFF"/>
    <!-- Calendar Header -->
    <path d="M5 18 C5 12.48 9.48 8 15 8 L55 8 C60.52 8 65 12.48 65 18 L65 24 L5 24 Z" fill="#6D28D9"/>
    <!-- Binder Rings -->
    <rect x="18" y="2" width="6" height="12" rx="3" fill="#DDD6FE"/>
    <rect x="46" y="2" width="6" height="12" rx="3" fill="#DDD6FE"/>
    <!-- Calendar Grid Dots -->
    <circle cx="20" cy="38" r="3.5" fill="#C4B5FD"/>
    <circle cx="35" cy="38" r="3.5" fill="#C4B5FD"/>
    <circle cx="50" cy="38" r="3.5" fill="#C4B5FD"/>
    <circle cx="20" cy="52" r="3.5" fill="#C4B5FD"/>
    <circle cx="35" cy="52" r="4.5" fill="#7C3AED"/>
    <circle cx="50" cy="52" r="3.5" fill="#C4B5FD"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(125, 155)">
    <rect width="150" height="26" rx="13" fill="#4C1D95" fill-opacity="0.5"/>
    <text x="75" y="17" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">COMMUNITY EVENT</text>
  </g>
</svg>
