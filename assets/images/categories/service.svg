<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <linearGradient id="serviceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <radialGradient id="serviceGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#serviceBg)"/>
  <rect width="400" height="225" fill="url(#serviceGlow)"/>

  <!-- Subtle Decorative Circles -->
  <circle cx="200" cy="95" r="75" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="200" cy="95" r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Service Badge Emblem -->
  <g transform="translate(165, 48)">
    <!-- Base Hexagon/Circle Badge -->
    <circle cx="35" cy="40" r="35" fill="#FFFFFF"/>
    <circle cx="35" cy="40" r="30" fill="#0284C7"/>
    <!-- Medical/Service Cross -->
    <rect x="30" y="22" width="10" height="36" rx="3" fill="#FFFFFF"/>
    <rect x="17" y="35" width="36" height="10" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(120, 155)">
    <rect width="160" height="26" rx="13" fill="#082F49" fill-opacity="0.5"/>
    <text x="80" y="17" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">COMMUNITY SERVICE</text>
  </g>
</svg>
