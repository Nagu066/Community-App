<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FEE2E2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#bgGrad)"/>
  <rect width="400" height="225" fill="url(#glow)"/>

  <!-- Subtle Decorative Circles -->
  <circle cx="200" cy="95" r="75" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="200" cy="95" r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Emergency Shield Icon -->
  <g transform="translate(165, 50)">
    <!-- Outer Shield Shadow/Border -->
    <path d="M35 5 L65 18 C65 52 35 78 35 78 C35 78 5 52 5 18 Z" fill="#7F1D1D" opacity="0.3"/>
    <!-- Main Shield -->
    <path d="M35 0 L66 14 C66 48 35 75 35 75 C35 75 4 48 4 14 Z" fill="url(#shieldGrad)"/>
    <!-- Inner Accent Shield -->
    <path d="M35 6 L60 17 C60 44 35 67 35 67 C35 67 10 44 10 17 Z" fill="#DC2626"/>
    <!-- Exclamation Mark -->
    <path d="M32 23 L38 23 L37 45 L33 45 Z" fill="#FFFFFF"/>
    <circle cx="35" cy="54" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(130, 155)">
    <rect width="140" height="26" rx="13" fill="#7F1D1D" fill-opacity="0.5"/>
    <text x="70" y="17" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">EMERGENCY</text>
  </g>
</svg>
