<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <linearGradient id="generalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="generalGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#generalBg)"/>
  <rect width="400" height="225" fill="url(#generalGlow)"/>

  <!-- Subtle Decorative Circles & Soundwaves -->
  <circle cx="200" cy="95" r="75" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="200" cy="95" r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Megaphone / Announcement Icon -->
  <g transform="translate(165, 48)">
    <circle cx="35" cy="40" r="35" fill="#FFFFFF"/>
    <circle cx="35" cy="40" r="30" fill="#3B82F6"/>
    <!-- Megaphone Cone -->
    <path d="M22 36 L38 27 L38 53 L22 44 Z" fill="#FFFFFF"/>
    <rect x="18" y="36" width="6" height="8" rx="2" fill="#FFFFFF"/>
    <path d="M38 31 C43 33 46 36 46 40 C46 44 43 47 38 49 Z" fill="#93C5FD"/>
    <path d="M26 44 L28 53 L32 53 L30 44 Z" fill="#FFFFFF"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(125, 155)">
    <rect width="150" height="26" rx="13" fill="#0F172A" fill-opacity="0.6"/>
    <text x="75" y="17" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">GENERAL NOTICE</text>
  </g>
</svg>
